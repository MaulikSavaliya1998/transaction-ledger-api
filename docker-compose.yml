services:
  mongodb:
    image: mongo:8.0
    container_name: transaction-ledger-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ['CMD-SHELL', 'mongosh --quiet --eval "try { rs.status().ok } catch (error) { quit(1) }"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-ledger-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/transaction_ledger?replicaSet=rs0
      LOG_LEVEL: info
      CORS_ORIGIN: '*'
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
